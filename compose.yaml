services:
  php:
    build: docker/php
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    ports:
      - "8088:8000"
    depends_on:
      - database

  database:
    # Même version majeure que les bases MySQL des hébergements OVH
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tournelion
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  database_data:
